[project]
name = "postmark"
version = "0.1.1"
description = "A high-performance email datastore designed to ingest, store, and expose email data for automation tasks and AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pyarrow>=12.0.0",
    "boto3>=1.26.0",
    "python-Levenshtein>=0.20.0",
    "prometheus-client>=0.16.0",
    "cortex-utils @ git+https://github.com/devonjones/cortex-utils.git@7c3d796a1252e719217151b75f255f74a29a9fa3",
    "pydantic>=2.0.0",
    "charset-normalizer>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=0.20.0",
    "indexed_gzip>=1.8.0",
    # Gmail sync dependencies
    "google-cloud-pubsub>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "duckdb>=0.9.0",
    "schedule>=1.2.0",
    "html2text>=2025.4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-boto3",
    "types-beautifulsoup4",
    "moto>=4.0.0",
]

[project.scripts]
# Gmail sync service
postmark-gmail-sync = "postmark.services.gmail_sync:main"
# Archived: Gmail takeout batch processing (moved to postmark.archive)
postmark-backfill = "postmark.archive.cli.backfill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/postmark"]

[tool.black]
line-length = 88
target-version = ['py311']
force-exclude = '''
/(
    \.venv
    | venv
    | build
    | dist
    | \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.svn
    | \.ipynb_checkpoints
    | tests/eml_fixtures
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "indexed_gzip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "schedule"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cortex_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
