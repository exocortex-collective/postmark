name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # For the *_live.py tests: SQL predicates a fake connection cannot check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (Format)
        run: |
          uv run black --check . --exclude "\.eml$"

      - name: Lint (Imports)
        run: |
          uv run isort --check-only .

      - name: Lint (Type)
        run: |
          uv run mypy src/postmark

      - name: Test
        run: |
          uv run pytest --maxfail=1 --disable-warnings -q

      - name: Fail if the live-Postgres tests were skipped
        run: uv run pytest tests/services/test_spam_label_events_live.py -q -p no:skipping
