name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create uv venv
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Lint (Format)
        run: |
          uv run black --check . --exclude "\.eml$"

      - name: Lint (Imports)
        run: |
          uv run isort --check-only .

      - name: Lint (Type)
        run: |
          uv run mypy . --ignore-missing-imports --disable-error-code=misc

      - name: Test
        run: |
          uv run pytest --maxfail=1 --disable-warnings -q
